name: 刷步数

on:
  schedule:
    - cron: '37 3,5,7,9,11,13,15,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mimotion-master-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
          ref: master
          fetch-depth: 0
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        shell: bash
        run: |
          set -euo pipefail

          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com

          git add -- encrypted_tokens.data
          if git diff --cached --quiet -- encrypted_tokens.data; then
            echo "No token changes to persist."
            exit 0
          fi

          git commit -m "persist tokens trigger by ${{ github.event_name }}"

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master

            if ! git rebase origin/master; then
              echo "::error::Token persistence conflicts with remote changes. No token data was overwritten."
              git status --short
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:master; then
              echo "Token persistence push succeeded."
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Token persistence push failed after ${max_attempts} attempts."
              exit 1
            fi

            echo "Remote branch changed, rebasing token commit before retry $((attempt + 1))/${max_attempts}..."
          done
